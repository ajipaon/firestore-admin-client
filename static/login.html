<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Authentication</title>
    <!-- HTMX for handling requests without full page reloads -->
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .success {
            color: green;
            margin-top: 10px;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: none;
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 4px;
            color: white;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 1000;
            max-width: 300px;
        }
        .toast.error {
            background-color: #dc3545;
        }
        .toast.success {
            background-color: #28a745;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <h1>Firebase Authentication</h1>

    <p>Note: This login form requires the FIREBASE_API_KEY environment variable to be set on the server.</p>

    <form hx-post="/auth/login" hx-target="#result" hx-swap="innerHTML">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit">Login</button>
    </form>

    <div id="result"></div>

    <div id="toast" class="toast"></div>

    <script>
        document.body.addEventListener('htmx:afterRequest', function(event) {
            const xhr = event.detail.xhr;

            // Try to parse response as JSON
            let response;
            try {
                if (xhr.responseText) {
                    response = JSON.parse(xhr.responseText);
                }
            } catch (e) {
                // Not JSON, use the response as is
                response = null;
            }

            // Handle JSON responses (including errors)
            if (response) {
                if (!response.success && response.error) {
                    // Show error toast
                    showToast(response.error, 'error');
                    return;
                }
            }

            // Handle HTML responses and successful requests
            if (event.detail.successful) {
                document.getElementById('result').style.display = 'block';
            } else {
                // For HTML error responses, extract the error message and show toast
                const errorMatch = xhr.responseText.match(/<div class="error">(.*?)<\/div>/);
                if (errorMatch && errorMatch[1]) {
                    showToast(errorMatch[1], 'error');
                }
            }
        });

        // Function to show toast notifications
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;

            // Show the toast
            setTimeout(function() {
                toast.classList.add('show');
            }, 100);

            // Hide the toast after 3 seconds
            setTimeout(function() {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
